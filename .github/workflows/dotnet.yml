name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# FSM_Helix is a historical experiment, not a release candidate.
# This workflow intentionally performs build validation only. It must never
# pack or publish a NuGet package; the old publish step could push on any
# master push or pull request when the NuGet secret was available.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore FSM_Bridge.Helix/FSM_Helix.csproj

      - name: Build
        run: dotnet build FSM_Bridge.Helix/FSM_Helix.csproj --no-restore --configuration Release
