name: .NET CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FSM_Bridge.Helix/FSM_Helix.csproj

      - name: Build
        run: dotnet build FSM_Bridge.Helix/FSM_Helix.csproj --no-restore --configuration Release
